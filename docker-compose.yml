services:
  scrambler:
    image: nginx:alpine
    container_name: scramble-stepper
    restart: unless-stopped
    ports:
      - "8088:80"
    security_opt:
      - no-new-privileges:true
    volumes:
      # Only the site files and the nginx config are mounted; .git and the rest of the repo stay private.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./shuffle.html:/usr/share/nginx/html/shuffle.html:ro
      - ./play.html:/usr/share/nginx/html/play.html:ro
      - ./timer.html:/usr/share/nginx/html/timer.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./vendor:/usr/share/nginx/html/vendor:ro
      - ./icon.svg:/usr/share/nginx/html/icon.svg:ro
      - ./favicon-32.png:/usr/share/nginx/html/favicon-32.png:ro
      - ./apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./icon-192.png:/usr/share/nginx/html/icon-192.png:ro
      - ./icon-512.png:/usr/share/nginx/html/icon-512.png:ro
      - ./og-image.png:/usr/share/nginx/html/og-image.png:ro
      - ./site.webmanifest:/usr/share/nginx/html/site.webmanifest:ro
      - ./robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./sitemap.xml:/usr/share/nginx/html/sitemap.xml:ro
